name: Validate
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
        working-directory: worker
      - name: Check Worker source
        run: npm run check
        working-directory: worker
      - name: Test authentication, Google Sheets model and CRUD API
        run: npm test
        working-directory: worker
