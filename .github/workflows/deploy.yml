name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Compatibility with repositories configured to publish from a branch:
  # the built React artifact must be deployed AFTER GitHub's branch-based Pages build.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fev-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build FEV frontend
        env:
          VITE_FEV_API_BASE_URL: ${{ vars.FEV_API_BASE_URL }}
          VITE_FEV_GOOGLE_CLIENT_ID: ${{ vars.FEV_GOOGLE_CLIENT_ID }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
